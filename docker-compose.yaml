# First run:
#   wget https://raw.githubusercontent.com/allburov/telegram-to-immich/main/.env.example -O .env   # fill in
#   docker compose run --rm sync tdl login -T qr  # scan the QR code with Telegram, session is kept in .data/tdl
#   docker compose run --rm sync tdl chat ls      # chat ids for .data/config/tg-to-immich.yaml
#   docker compose up -d
services:
  sync:
    image: allburov/telegram-to-immich
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-6h}
    volumes:
      - ./.data:/data
